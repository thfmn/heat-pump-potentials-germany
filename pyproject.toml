[project]
name = "heat-pump-potentials-germany"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.22.0",
    "pandas>=1.5.3",
    "geopandas>=0.13.2",
    "shapely>=2.0.1",
    "requests>=2.29.0",
    "duckdb>=0.8.1",
    "plotly>=5.9.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pandas-stubs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
